name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create a draft release on tags

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Logic tests
        run: |
          g++ -std=c++17 -Wall -Wextra -I. tests/test_logic.cpp -o test_logic
          ./test_logic

  build:
    needs: test
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@v4

      - name: Prepare vcpkg cache
        run: New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      - uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Configure (x86, static curl)
        run: >
          cmake -S . -B build -A Win32
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x86-windows-static-md

      - name: Build
        run: cmake --build build --config Release

      - name: Check the DLL exists and exports the entry points
        run: |
          $dll = "build/Release/KWIQPlugin.dll"
          if (-not (Test-Path $dll)) { throw "KWIQPlugin.dll was not produced" }
          Get-Item $dll | Select-Object Name, Length
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $dll))
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          foreach ($n in "EuroScopePlugInInit", "EuroScopePlugInExit") {
            if ($text -notmatch [regex]::Escape($n)) { throw "export $n not found in the DLL" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: KWIQPlugin
          path: build/Release/KWIQPlugin.dll
          if-no-files-found: error

      - name: Draft release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" build/Release/KWIQPlugin.dll --draft --generate-notes
