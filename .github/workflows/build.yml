name: build

# Versions are Semantic Versioning (https://semver.org/). The version is KWIQ_VERSION in version.h,
# changed by hand in the pull request that should make a release. Every build also carries build metadata,
# <run>.<commit> (0.7.0+115.a1b2c3d), shown in .kwiq status and the log but never compared.
# main:          tested and built on every push. The version is published as a release, tagged v<version>,
#                only if that version isn't released yet: a release happens once per version, when version.h
#                changes it. Core offers releases to controllers. A release carries the three DLLs:
#                KWIQPlugin.dll (the loader the packages ship), KWIQPluginUpdater.dll and
#                KWIQPluginCore.dll (which Core mirrors for the updater).
# pull requests: each one gets a test pre-release tagged pr-<number>, version <version>-pr.<number>.<run>,
#                replaced on every push and removed when the pull request is closed. Each one is linked in
#                a comment on the pull request. Core never offers pre-releases.
# manual run on another branch: a test pre-release named after the branch, version <version>-dev.<run>.
#                A release that failed (or was left incomplete) is tried again by the next push or manual run.
# A pull request is only released when it changes what goes into the DLL (sources, resources,
# CMakeLists.txt, vcpkg.json, src/, resource/, third_party/). Anything else (tests, docs, workflows) is still tested and built,
# but not released. A manual run always releases (on main, still only a version not yet released).
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

# Read only by default: the test and build jobs compile the pull request's code. Only the jobs that publish get
# more, each in its own permissions block.
permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  # A newer push replaces a pull request's test build, but a release from main is always finished
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.diff.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether the DLL's inputs changed
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then echo "release=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # main releases once per version, and the release step skips a version already released, so every
          # push goes on to it: that is also how a failed release is tried again
          if [ "$GITHUB_EVENT_NAME" = push ]; then echo "release=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # a pull request is compared as a whole, so it keeps its test build after a later test-only push
          if ! changed=$(git diff --name-only "$BASE" HEAD); then
            echo "Could not compare with $BASE, releasing anyway"; echo "release=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$changed"
          if echo "$changed" | grep -qE '^(src/.*|resource/.*\.(rc|h|bmp)|third_party/.*|CMakeLists\.txt|vcpkg\.json)$'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to the DLL's inputs, so no release"; echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Logic tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Isrc/utils -Isrc/plugin test/test_logic.cpp -o test_logic
          ./test_logic
      # The same tests with AddressSanitizer and UndefinedBehaviorSanitizer: an out-of-bounds read, an overflow or
      # other undefined behaviour in the pure logic fails the build
      - name: Logic tests (sanitizers)
        run: |
          g++ -std=c++17 -g -O1 -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer \
            -Wall -Wextra -Isrc/utils -Isrc/plugin test/test_logic.cpp -o test_logic_san
          ./test_logic_san

  build:
    needs: test
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # version.h's KWIQ_VERSION, which must be SemVer. Its build metadata, if any, is replaced by
      # <run>.<commit>. A pull request builds <version>-pr.<number>.<run>, another branch <version>-dev.<run>
      # (appended to an existing pre-release: 0.7.0-rc.1.pr.66.115), so a test build is always lower than the
      # release it leads to.
      - name: Version
        id: version
        shell: bash
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN: ${{ github.run_number }}
        run: |
          v=$(sed -n 's/^#define KWIQ_VERSION "\(.*\)"/\1/p' src/utils/version.h)
          # semver.org's own pattern: no leading zeros in numbers, including numeric pre-release identifiers
          n='(0|[1-9][0-9]*)'; id='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          semver="^$n\\.$n\\.$n(-$id(\\.$id)*)?(\\+[0-9A-Za-z-]+(\\.[0-9A-Za-z-]+)*)?\$"
          [[ "$v" =~ $semver ]] || { echo "::error::KWIQ_VERSION in version.h is not a SemVer version: '$v'"; exit 1; }
          v=${v%%+*}
          # pr and dev mark test builds (kwiq::RunningVersion), so version.h can't use them itself
          if [[ "$v" == *-* && ".${v#*-}." =~ \.(pr|dev)\. ]]; then
            echo "::error::KWIQ_VERSION in version.h can't use 'pr' or 'dev' in its pre-release: they mark test builds"; exit 1
          fi
          pre=""
          if [ -n "$PR" ]; then pre="pr.$PR.$RUN"
          elif [ "$GITHUB_REF" != refs/heads/main ]; then pre="dev.$RUN"; fi
          if [ -n "$pre" ]; then case "$v" in *-*) v="$v.$pre" ;; *) v="$v-$pre" ;; esac; fi
          meta="$RUN.${SHA:0:7}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "metadata=$meta" >> "$GITHUB_OUTPUT"
          echo "Building $v+$meta"

      - name: Prepare vcpkg cache
        run: New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      - uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Configure (x86, static curl)
        run: >
          cmake -S . -B build -A Win32
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x86-windows-static-md
          -DKWIQ_BUILD_VERSION="${{ steps.version.outputs.version }}"
          -DKWIQ_BUILD_METADATA="${{ steps.version.outputs.metadata }}"

      - name: Build
        run: |
          cmake --build build --config Release 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # Every compiler warning, once each (#41). Vendored code (third_party/, vcpkg, src/plugin/vch,
      # src/plugin/slots) may have some; KWIQ's own files must have none.
      - name: Compiler warnings
        run: |
          $all = @(Select-String -Path build.log -Pattern ': warning C\d+' |
                   ForEach-Object { ($_.Line -replace '\s*\[[^\]]*\]\s*$', '').Trim() } | Sort-Object -Unique)
          $vendored = '(?i)[\\/](third_party|vcpkg_installed|vch|slots)[\\/]'
          $own = @($all | Where-Object { $_ -notmatch $vendored })
          "$($all.Count) warning(s), $($own.Count) of them in KWIQ's own files"
          foreach ($w in $all) { if ($w -match $vendored) { "  vendored: $w" } else { "::warning::$w" } }
          if ($own.Count) { throw "KWIQ's own files must build without warnings" }

      - name: Check the three DLLs exist and export their entry points
        run: |
          $checks = @{
            "build/Release/KWIQPlugin.dll"        = @("EuroScopePlugInInit", "EuroScopePlugInExit")
            "build/Release/KWIQPluginUpdater.dll" = @("KWIQUpdaterRun", "KWIQUpdaterVersion")
            "build/Release/KWIQPluginCore.dll"    = @("KWIQCoreStart", "KWIQCoreInit", "KWIQCoreExit", "KWIQCoreVersion")
          }
          foreach ($dll in $checks.Keys) {
            if (-not (Test-Path $dll)) { throw "$dll was not produced" }
            Get-Item $dll | Select-Object Name, Length
            $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes((Resolve-Path $dll)))
            foreach ($n in $checks[$dll]) {
              if ($text -notmatch [regex]::Escape($n)) { throw "export $n not found in $dll" }
            }
          }
          # 0.5 copies update by taking the plugin out of KWIQPlugin.dll (its KWIQCORE resource), so it must be in it
          if ((Get-Item build/Release/KWIQPlugin.dll).Length -le (Get-Item build/Release/KWIQPluginCore.dll).Length) {
            throw "KWIQPlugin.dll does not carry KWIQPluginCore.dll (KWIQCORE), which 0.5 copies update from"
          }

      # Releases carry all three: the packages ship KWIQPlugin.dll, and Core mirrors the updater and
      # the plugin for KWIQPluginUpdater.dll to download
      - uses: actions/upload-artifact@v4
        with:
          name: KWIQPlugin
          path: |
            build/Release/KWIQPlugin.dll
            build/Release/KWIQPluginUpdater.dll
            build/Release/KWIQPluginCore.dll
          if-no-files-found: error

  release:
    needs: [changes, build]
    # pull requests from forks get a read-only token, so they only get the artifact
    if: >
      needs.changes.outputs.release == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to create releases
      pull-requests: write   # to say on a pull request that its test build is published
    outputs:
      published: ${{ steps.main.outputs.published }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KWIQPlugin

      # Once per version: a version already released with all three DLLs is not released again (bump
      # version.h). Anything less (an earlier run that failed, or a draft left behind) is replaced, so the
      # next push or manual run tries again. The release is made as a draft and only published once all three
      # DLLs are on it: the tag only appears then, and Core never sees a release without its files.
      - name: Release (main)
        id: main
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        run: |
          tag="v$VERSION"; files="KWIQPlugin.dll KWIQPluginUpdater.dll KWIQPluginCore.dll"
          # only "release not found" means there is none; any other error stops here rather than release twice
          if info=$(gh release view "$tag" --json isDraft,assets -q '[.isDraft, ([.assets[].name] | sort | join(" "))] | @tsv' 2>&1); then
            IFS=$'\t' read -r draft names <<< "$info"
            if [ "$draft" = false ] && [ "$names" = "$(tr ' ' '\n' <<< "$files" | LC_ALL=C sort | paste -sd ' ')" ]; then
              echo "::notice::$tag is already released, so nothing is published. Change KWIQ_VERSION in version.h to release."
              exit 0
            fi
            echo "::warning::$tag exists but is incomplete (draft: $draft, files: ${names:-none}), so it is made again"
            gh release delete "$tag" --cleanup-tag --yes
          elif ! grep -qi 'release not found' <<< "$info"; then
            echo "::error::Could not check whether $tag is already released: $info"; exit 1
          elif gh api "repos/$GH_REPO/git/ref/tags/$tag" --silent 2>/dev/null; then
            # a tag with no release wasn't made here (drafts have no tag): leave it to a person
            echo "::error::Tag $tag exists without a release. Delete the tag, or change KWIQ_VERSION in version.h."; exit 1
          fi
          # a pre-release version (0.7.0-rc.1) is published as a GitHub pre-release, which Core never offers
          case "$VERSION" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$tag" $files $pre --draft --target "$GITHUB_SHA" --title "KWIQ Controller Plugin $VERSION" --generate-notes
          gh release edit "$tag" --draft=false
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Test pre-release (pull requests and other branches)
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
        env:
          PR: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$PR" ]; then tag="pr-$PR"; title="Test build for #$PR: $PR_TITLE ($VERSION)"
          else tag="test-$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"; title="Test build of $GITHUB_REF_NAME ($VERSION)"; fi
          gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" KWIQPlugin.dll KWIQPluginUpdater.dll KWIQPluginCore.dll --prerelease --target "$SHA" --title "$title" \
            --notes "For testing only. Core does not offer pre-releases to controllers. Built from ${SHA:0:7}."
          # One comment per pull request, edited on every push, not a new one each time
          if [ -n "$PR" ]; then
            url=$(gh release view "$tag" --json url -q .url)
            marker="<!-- kwiq-test-build -->"
            body="$marker
          Test build $VERSION has been published as a pre-release: [$tag]($url) (built from ${SHA:0:7})."
            id=$(gh api --paginate "repos/$GH_REPO/issues/$PR/comments" \
                   --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | tail -n 1)
            if [ -n "$id" ]; then gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -f body="$body" > /dev/null
            else gh pr comment "$PR" --body "$body"; fi
          fi

  changelog:
    # Every release from main rebuilds the changelog on docs.kuwait-iraqvacc.net from the release notes of
    # every published release (pre-releases are never listed), and commits it to kwiq-documentation-site,
    # which deploys on every push. Needs DOCS_REPO_TOKEN: Contents read and write on that repository only.
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read         # reads the releases; the docs repository is written with DOCS_REPO_TOKEN
    env:
      GH_TOKEN: ${{ github.token }}
      DOCS_TOKEN: ${{ secrets.DOCS_REPO_TOKEN }}
      PAGE: docs/Controller Guidance/KWIQ Controller Plugin/Changelog.md
    steps:
      - name: Check for the token
        id: token
        run: |
          if [ -z "$DOCS_TOKEN" ]; then echo "::warning::DOCS_REPO_TOKEN is not set, so the changelog was not updated"; echo "ok=false" >> "$GITHUB_OUTPUT"
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
        with:
          repository: Kuwait-Iraq-vACC/kwiq-documentation-site
          token: ${{ secrets.DOCS_REPO_TOKEN }}
          path: docs-site

      - name: Write the changelog
        if: steps.token.outputs.ok == 'true'
        run: |
          cat > gen.py <<'PY'
          import json, re, sys
          # stdin: one release per line (tag_name, published_at, body); argv[1]: output Changelog.md
          rels = [json.loads(l) for l in sys.stdin if l.strip()]
          rels.sort(key=lambda r: r["published_at"], reverse=True)
          out = ["---", "title: Changelog", "---", "",
                 "Every release of the KWIQ Controller Plugin, newest first. The plugin offers each one as EuroScope starts.", ""]
          for r in rels:
              items = []
              for line in (r.get("body") or "").splitlines():
                  m = re.match(r"^\s*[*-]\s+(.*?)(?:\s+by\s+@\S+)?(?:\s+in\s+https?://\S+)?\s*$", line)
                  if not m or line.lstrip().startswith(("**Full Changelog", "* @")):
                      continue
                  t = m.group(1).strip()
                  if t and "made their first contribution" not in t:
                      items.append("- " + t)
              out += ["## " + r["tag_name"].lstrip("v"), "", "*" + r["published_at"][:10] + "*", ""]
              out += items or ["- Maintenance release."]
              out.append("")
          open(sys.argv[1], "w").write("\n".join(out))
          PY
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.prerelease|not) | select(.draft|not) | {tag_name, published_at, body}' \
            | python3 gen.py "docs-site/$PAGE"

      - name: Commit it
        if: steps.token.outputs.ok == 'true'
        working-directory: docs-site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PAGE"
          git diff --cached --quiet && { echo "unchanged"; exit 0; }
          git commit -m "KWIQ Controller Plugin changelog (${GITHUB_SHA::7})"
          git push

  cleanup:
    # a closed pull request no longer needs its test build
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to delete the test pre-release and its tag
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Remove the test pre-release
        run: gh release delete "pr-${{ github.event.pull_request.number }}" --cleanup-tag --yes || true
